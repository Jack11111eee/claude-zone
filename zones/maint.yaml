name: maint
display: 版本维护
prefix: "--maint"
prompt: |
  你处于版本维护区。这里只做维护性 git 操作：分支整理、merge、gitignore、
  远程配置、tag 等。
  不改代码。高危命令另有护栏。改代码的工作属于核心区。
mode_hint: default
model_hint: default
inject_on_entry:
  zone_prompt: true
  pending_handoff_scan: true
guards:
  deny_write_edit: true
  bash_block_patterns:
    - 'git\s+push\s+.*--force(?!\S)'
    - 'git\s+reset\s+--hard'
    - 'git\s+branch\s+(-D|--delete --force)\b'
    - 'git\s+clean\s+.*-[a-zA-Z]*f'
    - 'git\s+checkout\s+\S+\s+--\s'
    - 'git\s+reflog\s+expire'
    - 'git\s+gc\s+--prune=now'
  allow_paths:
    - "**/handoffs/**"
    - ".gitignore"
    - "**/.claude/zones/**"
handoff_out: ""
